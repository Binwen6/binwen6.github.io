<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Research Wiki</title>
    <meta
      name="description"
      content="A bilingual mechanistic interpretability research wiki organized by problem type."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site">
      <aside class="sidebar">
        <a class="brand" href="#/" aria-label="LLM Research Wiki home">
          <span class="brand-mark">λ</span>
          <span>
            <strong id="brandTitle">LLM Research Wiki</strong>
            <small id="brandSub">Mechanistic interpretability field guide</small>
          </span>
        </a>

        <div class="control">
          <label id="searchLabel" for="search">搜索目录与文章</label>
          <input id="search" type="search" autocomplete="off" />
        </div>

        <div class="control">
          <label id="langLabel" for="language">语言</label>
          <select id="language">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="quick-links">
          <a id="allLink" href="#/">全部文章</a>
          <a id="refsLink" href="#/references">参考文献</a>
        </div>

        <nav id="toc" class="toc" aria-label="Table of contents"></nav>
      </aside>

      <main id="content" class="content"></main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
